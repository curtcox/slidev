<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

<body>
  <main class="editor-app">
    <div class="workspace-heading">
      <h1>Your ideas, on slides.</h1>
      <p id="preview-status" role="status" aria-live="polite" data-fk-primary-status>Opening document…</p>
    </div>
    <div id="workspace-tabs"></div>
    <div id="workspace" class="workspace">
      <section id="slides-panel" class="slides-panel" aria-label="Slides">
        <div class="preview-toolbar" role="toolbar" aria-label="Preview navigation">
          <button id="previous-slide" type="button" aria-label="Previous slide" disabled>←</button>
          <span id="slide-position" aria-live="polite">No preview</span>
          <button id="next-slide" type="button" aria-label="Next slide" disabled>→</button>
          <button id="overview" type="button" aria-haspopup="dialog" aria-controls="overview-dialog" disabled>Overview</button>
          <button id="dark-mode" type="button" aria-pressed="false">Dark slides</button>
        </div>
        <div id="preview" aria-label="Slide preview"></div>
        <details id="notes" hidden><summary>Speaker notes</summary><pre id="slide-notes"></pre></details>
      </section>
      <div id="divider" role="separator" tabindex="0" aria-label="Resize slide preview" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75" aria-valuenow="55"></div>
      <section id="markdown-panel" class="source-panel" aria-label="Markdown editor">
        <h2>slides.md</h2>
        <div id="markdown-editor" class="editor"></div>
      </section>
      <section id="css-panel" class="source-panel" aria-label="CSS editor">
        <h2>style.css</h2>
        <div id="css-editor" class="editor"></div>
      </section>
    </div>
