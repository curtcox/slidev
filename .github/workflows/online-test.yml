name: Online tests
on:
  pull_request:
    paths:
      - online/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/online-*.yml
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    uses: curtcox/Tools-for-pages-with-state-in-URL-fragments/.github/workflows/test.yml@v4
    with:
      working-directory: online
      node-version: '24'
      mobile: false
      pre-test: |
        # Shared test.yml@v4 handles Azure mirrors, but newer runners use EC2.
        if [ -n "${BROWSER:-}" ]; then
          sudo find /etc/apt -maxdepth 2 -type f \( -name '*.sources' -o -name '*.list' -o -name '*-mirrors.txt' \) \
            -exec sed -i -E 's|https?://([[:alnum:]-]+\.)?ec2\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
        fi
        cd "$GITHUB_WORKSPACE"
        corepack enable
        pnpm install --frozen-lockfile
        pnpm build
        pnpm -C online/runtime build
        npm --prefix online run build
      server-command: npm run serve
      browser-command: |
        node tests/browser/all.cjs http://127.0.0.1:8000/ "$BROWSER"
        node tests/browser/runtime.cjs http://127.0.0.1:8000/ "$BROWSER"
        node tests/browser/icons.cjs http://127.0.0.1:8000/ "$BROWSER"
        node tests/browser/languages.cjs http://127.0.0.1:8000/ "$BROWSER"
        node tests/browser/math.cjs http://127.0.0.1:8000/ "$BROWSER"
        node tests/browser/diagrams.cjs http://127.0.0.1:8000/ "$BROWSER"
        node tests/browser/drag.cjs http://127.0.0.1:8000/ "$BROWSER"
        node runtime/tests/run.mjs
      gallery-command: npm run gallery:check
  kit:
    uses: curtcox/Tools-for-pages-with-state-in-URL-fragments/.github/workflows/kit-check.yml@v2
    with:
      kit-path: online/vendor/fragment-kit-v0.4.4
  fidelity:
    name: Runtime visual fidelity (report)
    runs-on: ubuntu-latest
    # Start as a report until the platform/font matrix is stable in Actions.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npm --prefix online ci
      - run: pnpm -C online/runtime run build
      - run: npm --prefix online run build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Compare the staged runtime against slidev build
        run: node online/runtime/tests/fidelity.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: online-runtime-fidelity
          path: |
            online/runtime/.cache/fidelity/report-*.json
            online/runtime/.cache/fidelity/screenshots/
